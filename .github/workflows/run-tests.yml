name: Run Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

# Cancel superseded runs on the same ref so a new push stops the previous
# in-flight matrix early. Keyed on workflow + ref. When invoked via
# workflow_call from build-release.yml on a main push, github.ref is the
# caller's ref; build-release serializes its own runs (cancel-in-progress:
# false), so this never cancels a release mid-flight.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The windows-latest leg was verified green with the broad
        # imagick/gd/soap extension setup across recent runs (ref #293,
        # follow-up to #263), so it is kept for cross-platform coverage.
        os: [ubuntu-latest, windows-latest]
        # Quoted so YAML keeps them as strings ('8.2'), which the include
        # entries below must match exactly to extend the existing legs.
        php: ['8.2', '8.3', '8.4']
        laravel: [12.*]
        stability: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          # Minimum patch per minor carrying the PHP2Shell fix
          # (CVE-2026-109618 / CVE-2026-109619). These extend the matching
          # php legs rather than adding jobs. (#398)
          - php: '8.2'
            php-floor: '8.2.35'
          - php: '8.3'
            php-floor: '8.3.36'
          - php: '8.4'
            php-floor: '8.4.27'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, ${{ matrix.os == 'ubuntu-latest' && 'pcntl, ' || '' }}pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          update: true

      - name: Assert PHP patch floor (PHP2Shell)
        # setup-php installs the newest patch it can find for a major.minor, so
        # an exact patch cannot be pinned. Fail loudly instead of silently
        # testing on a patch level vulnerable to PHP2Shell
        # (CVE-2026-109618 / CVE-2026-109619). (#398)
        shell: bash
        env:
          PHP_FLOOR: ${{ matrix.php-floor }}
        run: |
          # An empty floor would make version_compare pass vacuously.
          if [ -z "$PHP_FLOOR" ]; then echo "::error::No PHP floor set for this job"; exit 1; fi
          echo "PHP_VERSION=$(php -r 'echo PHP_VERSION;') floor=$PHP_FLOOR"
          if ! php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_FLOOR"), ">=") ? 0 : 1);'; then
            echo "::error::PHP $(php -r 'echo PHP_VERSION;') is below $PHP_FLOOR, the PHP2Shell fix (CVE-2026-109618 / CVE-2026-109619)"
            exit 1
          fi

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-l${{ matrix.laravel }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest

  version-script:
    # The build/version.sh version-derivation logic (branch matrix + the
    # CHANGELOG-read/patch-fallback paths added in #186) has no PHP, so it is
    # guarded by a standalone bash harness rather than the Pest matrix above.
    # Runs once on ubuntu-latest — no PHP/composer needed, just git + bash.
    name: version.sh regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run version.sh regression harness
        run: bash build/version.test.sh
