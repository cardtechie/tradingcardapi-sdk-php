name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref so a new push stops the previous
# in-flight PHPStan/Pint/coverage jobs early.
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
          update: true

      - name: Assert PHP patch floor (PHP2Shell)
        # setup-php installs the newest patch it can find for a major.minor, so
        # an exact patch cannot be pinned. Fail loudly instead of silently
        # testing on a patch level vulnerable to PHP2Shell
        # (CVE-2026-109618 / CVE-2026-109619). (#398)
        shell: bash
        env:
          PHP_FLOOR: '8.4.27'
        run: |
          # An empty floor would make version_compare pass vacuously.
          if [ -z "$PHP_FLOOR" ]; then echo "::error::No PHP floor set for this job"; exit 1; fi
          echo "PHP_VERSION=$(php -r 'echo PHP_VERSION;') floor=$PHP_FLOOR"
          if ! php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_FLOOR"), ">=") ? 0 : 1);'; then
            echo "::error::PHP $(php -r 'echo PHP_VERSION;') is below $PHP_FLOOR, the PHP2Shell fix (CVE-2026-109618 / CVE-2026-109619)"
            exit 1
          fi

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4 (4.0.0)

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --error-format=github

  pint:
    name: Laravel Pint Code Style
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          update: true

      - name: Assert PHP patch floor (PHP2Shell)
        # setup-php installs the newest patch it can find for a major.minor, so
        # an exact patch cannot be pinned. Fail loudly instead of silently
        # testing on a patch level vulnerable to PHP2Shell
        # (CVE-2026-109618 / CVE-2026-109619). (#398)
        shell: bash
        env:
          PHP_FLOOR: '8.4.27'
        run: |
          # An empty floor would make version_compare pass vacuously.
          if [ -z "$PHP_FLOOR" ]; then echo "::error::No PHP floor set for this job"; exit 1; fi
          echo "PHP_VERSION=$(php -r 'echo PHP_VERSION;') floor=$PHP_FLOOR"
          if ! php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_FLOOR"), ">=") ? 0 : 1);'; then
            echo "::error::PHP $(php -r 'echo PHP_VERSION;') is below $PHP_FLOOR, the PHP2Shell fix (CVE-2026-109618 / CVE-2026-109619)"
            exit 1
          fi

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4 (4.0.0)

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test

  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    # Run coverage on every pull request and on develop pushes, but skip it on
    # main pushes: the suite already ran on the PR, so re-running it a third
    # time on the post-merge main push is redundant work that lengthens CI
    # without strengthening the gate (PR review and develop keep it). (#307)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov
          update: true

      - name: Assert PHP patch floor (PHP2Shell)
        # setup-php installs the newest patch it can find for a major.minor, so
        # an exact patch cannot be pinned. Fail loudly instead of silently
        # testing on a patch level vulnerable to PHP2Shell
        # (CVE-2026-109618 / CVE-2026-109619). (#398)
        shell: bash
        env:
          PHP_FLOOR: '8.4.27'
        run: |
          # An empty floor would make version_compare pass vacuously.
          if [ -z "$PHP_FLOOR" ]; then echo "::error::No PHP floor set for this job"; exit 1; fi
          echo "PHP_VERSION=$(php -r 'echo PHP_VERSION;') floor=$PHP_FLOOR"
          if ! php -r 'exit(version_compare(PHP_VERSION, getenv("PHP_FLOOR"), ">=") ? 0 : 1);'; then
            echo "::error::PHP $(php -r 'echo PHP_VERSION;') is below $PHP_FLOOR, the PHP2Shell fix (CVE-2026-109618 / CVE-2026-109619)"
            exit 1
          fi

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4 (4.0.0)

      - name: Run tests with coverage
        run: ./vendor/bin/pest --coverage --min=80

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.0

      - name: Run markdownlint
        run: markdownlint '**/*.md' --ignore '**/node_modules/**' --ignore vendor --ignore 'changelog.d/**'