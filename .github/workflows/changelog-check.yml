name: "Release Validation"

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-release:
    name: "Validate Release Requirements"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Make build scripts executable
        run: chmod +x build/*.sh

      - name: Check release requirements
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "🔍 Validating release requirements..."
          echo ""
          
          VALIDATION_FAILED=false
          
          # Informational only: the build identifier this PR's head ref would
          # produce. It is NOT the version the release will tag - branch build
          # identifiers (alpha/beta/rc/hotfix suffixes) never get tagged.
          # (PR_HEAD_REF is supplied via the step-level env: block.)
          if [[ -n "$PR_HEAD_REF" ]]; then
            BRANCH_VERSION=$(bash build/version.sh --branch="$PR_HEAD_REF")
          else
            BRANCH_VERSION=$(bash build/version.sh)
          fi
          
          echo "Branch build identifier for this head ref: $BRANCH_VERSION"
          echo ""
          
          # For PRs to main, we expect a proper release version in changelog
          # (PR_BASE_BRANCH is supplied via the step-level env: block)
          RELEASE_VERSION=""
          if [ "$PR_BASE_BRANCH" = "main" ]; then
            echo "🎯 PR targets main branch - release changelog validation required"
            
            # Derive the expected release version exactly the way the release
            # itself does: build-release.yml runs version.sh on main after the
            # merge and tags whatever it emits. Deriving it from the head ref
            # instead only ever round-tripped for release/* branches, which made
            # develop/* and hotfix/* PRs to main unsatisfiable and feature/* and
            # dependabot/* PRs pass vacuously (#358). actions/checkout above uses
            # fetch-depth: 0, so tags are present for this derivation.
            RELEASE_VERSION=$(bash build/version.sh --branch=main)
            echo "Expected release version: $RELEASE_VERSION"
            
            # Only release-shaped head refs are expected to carry the collated
            # release section. Feature/bugfix/dependabot PRs to main pass
            # vacuously today; skipping them explicitly preserves that behaviour
            # (notably dependabot-auto-merge.yml) rather than newly failing them.
            # Tightening the gate to cover them is tracked separately (#340).
            case "$PR_HEAD_REF" in
              release/*|develop|hotfix/*)
                # Check that CHANGELOG.md has section for this release version
                if grep -q "^## \[$RELEASE_VERSION\]" CHANGELOG.md; then
                  echo "✅ Version section [$RELEASE_VERSION] found in CHANGELOG.md"
                else
                  echo "❌ No version section [$RELEASE_VERSION] found in CHANGELOG.md"
                  echo "   CHANGELOG.md has not been advanced past the latest release tag."
                  echo "   A release-shaped PR to main IS the release, so it must carry the"
                  echo "   collated section: fold the pending changelog.d/ fragments into a new"
                  echo "   '## [$RELEASE_VERSION] - $(date +%Y-%m-%d)' section and delete the"
                  echo "   fragments you consumed. See changelog.d/README.md."
                  echo "   Do not hand-add an empty section just to satisfy this check."
                  VALIDATION_FAILED=true
                fi
                ;;
              *)
                echo "ℹ️  Head ref '$PR_HEAD_REF' is not release-shaped (release/*, develop, hotfix/*)"
                echo "   - skipping the CHANGELOG release-section check."
                ;;
            esac
          else
            echo "ℹ️  PR targets $PR_BASE_BRANCH branch - no release validation needed"
          fi
          
          # Verify composer.json does NOT have hardcoded version (to prevent Packagist issues)
          if grep -q '"version"' composer.json; then
            echo "❌ Hardcoded version found in composer.json"
            echo "   Remove the 'version' field to prevent Packagist publishing issues"
            echo "   Versions are managed through git tags, not composer.json"
            VALIDATION_FAILED=true
          else
            echo "✅ No hardcoded version in composer.json (managed by git tags)"
          fi
          
          if [ "$VALIDATION_FAILED" = true ]; then
            echo ""
            echo "📝 To fix validation issues:"
            echo "1. Ensure no 'version' field exists in composer.json"
            if [ -n "$RELEASE_VERSION" ]; then
              echo "2. Collate the pending changelog.d/ fragments into a"
              echo "   '## [$RELEASE_VERSION]' section in CHANGELOG.md (see changelog.d/README.md)"
              echo "3. Release-shaped PRs to main (release/*, develop, hotfix/*) must carry that section"
            fi
            echo ""
            echo "📚 See .claude/CLAUDE.md for complete release process documentation"
          fi
          
          echo ""
          if [ "$VALIDATION_FAILED" = true ]; then
            echo "❌ Validation failed - please address the issues above"
            exit 1
          else
            echo "✅ All validation checks passed!"
          fi