name: "Release Validation"

# Version sections in CHANGELOG.md are written after merge, by
# build/commit-changelog-back.sh in build-release.yml (#406). So a PR into
# main must NOT add its own `## [X.Y.Z]` section: it would be collated over,
# claim a version another PR may also claim, and break the commit-back's
# resume check, which relies on only the bot's commit introducing a version
# section. Changes go in a changelog.d/ fragment instead.
#
# `edited` re-runs the check when a PR is retargeted onto main.
on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate-release:
    name: "Validate Release Requirements"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check release requirements
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "🔍 Validating release requirements for $PR_HEAD_REF → $PR_BASE_BRANCH..."
          echo ""

          VALIDATION_FAILED=false

          # PRs into main must not hand-write a version section (#406). The
          # cardtechie-ops-bot App is exempt: its commit-back is the one
          # writer of version sections.
          if [ "$PR_BASE_BRANCH" = "main" ] && [ "$PR_AUTHOR" != "cardtechie-ops-bot[bot]" ]; then
            git fetch --no-tags origin main
            ADDED_SECTIONS=$(git diff "origin/main...HEAD" -- CHANGELOG.md \
              | grep -E '^\+## \[[0-9]+\.[0-9]+\.[0-9]+\]' || true)
            if [ -n "$ADDED_SECTIONS" ]; then
              echo "❌ This PR adds a version section to CHANGELOG.md:"
              printf '   %s\n' "${ADDED_SECTIONS//+## /## }"
              echo "   Version sections are written after merge by build-release.yml"
              echo "   (build/commit-changelog-back.sh). Remove the section and add a"
              echo "   changelog.d/<issue>-<type>.md fragment instead (see changelog.d/README.md)."
              VALIDATION_FAILED=true
            else
              echo "✅ No hand-written version section in CHANGELOG.md"
            fi
          else
            echo "ℹ️  Version-section check skipped (base $PR_BASE_BRANCH, author $PR_AUTHOR)"
          fi

          # Verify composer.json does NOT have hardcoded version (to prevent Packagist issues)
          if grep -q '"version"' composer.json; then
            echo "❌ Hardcoded version found in composer.json"
            echo "   Remove the 'version' field to prevent Packagist publishing issues"
            echo "   Versions are managed through git tags, not composer.json"
            VALIDATION_FAILED=true
          else
            echo "✅ No hardcoded version in composer.json (managed by git tags)"
          fi

          echo ""
          if [ "$VALIDATION_FAILED" = true ]; then
            echo "📚 See docs/RELEASING.md for the release process."
            echo "❌ Validation failed - please address the issues above"
            exit 1
          else
            echo "✅ All validation checks passed!"
          fi
