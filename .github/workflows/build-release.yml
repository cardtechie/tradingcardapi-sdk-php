name: "Build and Release"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Serialize release runs on a given ref but NEVER cancel one in progress —
# a release must run to completion (version, tests, GitHub release, Packagist).
# Collation (#406) reads main, commits back, and pushes, so two merges landing
# close together would otherwise compute the same version and the second
# push would be rejected as a non-fast-forward. Cancelling an in-flight run
# could strand a collated CHANGELOG on main with no tag or release.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  version:
    name: "Generate Version"
    runs-on: ubuntu-latest
    # Self-trigger guard (#406), same as the release job below: the bot's
    # commit-back push must not start a second release run.
    if: >-
      ${{ !(startsWith(github.event.head_commit.message, 'chore(release): collate CHANGELOG for ')
      && github.event.sender.login == 'cardtechie-ops-bot[bot]') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Make build scripts executable
        run: chmod +x build/*.sh

      - name: Generate version
        id: version
        run: |
          # For push events, explicitly use the branch name from context
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ -n "$BRANCH_NAME" ]]; then
            VERSION=$(bash build/version.sh --branch="$BRANCH_NAME")
          else
            VERSION=$(bash build/version.sh)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          
          # Determine if this is a release version (not dev/beta/rc)
          IS_RELEASE=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_RELEASE=true
          fi
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          
          # Should we create a release?
          SHOULD_RELEASE=false
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$IS_RELEASE" == "true" ]]; then
            SHOULD_RELEASE=true
          elif [[ "$GITHUB_REF" == "refs/heads/develop" && "$VERSION" =~ \.beta- ]]; then
            SHOULD_RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            SHOULD_RELEASE=true
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          
          echo "Generated version: $VERSION"
          echo "Is release: $IS_RELEASE"  
          echo "Should release: $SHOULD_RELEASE"

  test:
    name: "Run Tests"
    uses: ./.github/workflows/run-tests.yml

  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [version, test]
    # Self-trigger guard (#406). The commit-back below deliberately carries no
    # [skip ci]: its push must start back-merge-stable-to-develop.yml so
    # develop receives the collated CHANGELOG. This guard is what stops that
    # push from starting a second release. BOTH halves are required: the
    # subject is an anchored prefix (startsWith), never a substring, and the
    # push must come from the cardtechie-ops-bot App. The identity half reads
    # github.event.sender.login (the authenticated pusher), not the commit's
    # author name, which is free text a PR author could spoof. Subject format:
    # build/commit-changelog-back.sh. workflow_dispatch has no head_commit, so
    # it is unaffected.
    if: >-
      ${{ needs.version.outputs.should_release == 'true'
      && !(startsWith(github.event.head_commit.message, 'chore(release): collate CHANGELOG for ')
      && github.event.sender.login == 'cardtechie-ops-bot[bot]') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.commit_back.outputs.release }}
      sha: ${{ steps.commit_back.outputs.sha }}
    steps:
      # cardtechie-ops-bot App installation token, never GITHUB_TOKEN or
      # PROJECT_TOKEN (#406). main's classic branch protection requires PRs;
      # the App is listed in its bypass_pull_request_allowances, so its token
      # is what may push the commit-back directly. Scoped to this repository
      # with contents: write only.
      - name: Create CardTechie App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CARDTECHIE_BOT }}
          private-key: ${{ secrets.CARDTECHIE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch tip, not github.sha, so the commit-back push
          # fast-forwards even when main moved after this run was queued.
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Never persist the App token into .git/config. The commit-back step
          # supplies it to its own push only, through the environment.
          persist-credentials: false

      - name: Generate version
        id: version
        env:
          PLANNED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          VERSION=$(bash build/version.sh --branch=main)
          if [[ "$VERSION" != "$PLANNED_VERSION" ]]; then
            echo "::warning::main moved since the version job ran: it planned $PLANNED_VERSION, the checked-out tip gives $VERSION. Using $VERSION."
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::build/version.sh gave '$VERSION' on main, which is not a release version."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      # Collation (#406): changelog.d/ fragments become a `## [VERSION]`
      # section here, AFTER the merge, never in a PR. It runs before the
      # release so the tag and the release notes both include the new
      # section. The script reports release=true|false; every later step runs
      # only on true, so a push with nothing pending stays a no-op instead of
      # publishing an empty release. A rerun after a failure past the
      # commit-back reports true without re-collating (resume). A rejected
      # push fails this step, so nothing is tagged, released or sent to
      # Packagist.
      - name: Collate changelog and commit back
        id: commit_back
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Push credential for this step only, as cardtechie-ops-bot. Set via
          # GIT_CONFIG_* so it lives in this process's environment and is never
          # written to .git/config (checkout runs with persist-credentials: false).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          basic_auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          # The runner masks the raw token, not its base64 form.
          echo "::add-mask::${basic_auth}"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic_auth}"
          bash build/commit-changelog-back.sh "$VERSION" --branch main --output "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        if: steps.commit_back.outputs.release == 'true'
        run: |
          # The `## [VERSION]` block, up to the next version heading or the
          # compare-link definitions at the bottom of CHANGELOG.md.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "::error::No '## [$VERSION]' section found in CHANGELOG.md after the commit-back."
            exit 1
          fi
          cat release_notes.md

      - name: Create GitHub Release
        if: steps.commit_back.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          # Tag the commit-back, not the triggering merge, so the tag carries
          # the collated section.
          target_commitish: ${{ steps.commit_back.outputs.sha }}
          draft: false
          prerelease: false

  packagist:
    name: "Update Packagist"
    runs-on: ubuntu-latest
    needs: [version, release]
    # Only when the release job actually published a release (#406).
    if: needs.release.outputs.release == 'true' && github.ref == 'refs/heads/main'
    steps:
      - name: Update Packagist
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://github.com/cardtechie/tradingcardapi-sdk-php"}}' \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            || echo "Packagist update failed or not configured"

  notify:
    name: "Notify Success" 
    runs-on: ubuntu-latest
    needs: [version, test, release]
    if: always() && needs.version.outputs.should_release == 'true'
    steps:
      - name: Release Summary
        env:
          RELEASED: ${{ needs.release.outputs.release }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          VERSION="${RELEASE_VERSION:-${{ needs.version.outputs.version }}}"
          IS_RELEASE="${{ needs.version.outputs.is_release }}"

          if [[ "$RELEASED" == "false" ]]; then
            {
              echo "## ℹ️ Nothing released"
              echo ""
              echo "No pending changelog entries in changelog.d/, so nothing was released."
              echo "Pending changes ship with the next merge that adds a fragment."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 🚀 Release Summary"
            echo ""
            echo "- **Version**: $VERSION"
            echo "- **Type**: $([ "$IS_RELEASE" = "true" ] && echo "Stable Release" || echo "Pre-release")"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Tests**: ${{ needs.test.result }}"
            echo "- **Release**: ${{ needs.release.result }}"
            echo ""
            echo "### 📦 Installation"
            echo '```bash'
            echo "composer require cardtechie/tradingcardapi-sdk-php:^$VERSION"
            echo '```'
            echo ""
            echo "🔗 **Links:**"
            echo "- [Release](https://github.com/cardtechie/tradingcardapi-sdk-php/releases/tag/$VERSION)"
            echo "- [Packagist](https://packagist.org/packages/cardtechie/tradingcardapi-sdk-php)"
            echo "- [Changelog](https://github.com/cardtechie/tradingcardapi-sdk-php/blob/main/CHANGELOG.md)"
          } >> "$GITHUB_STEP_SUMMARY"